<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <!-- Card -->
  <rect width="680" height="200" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" fill="#2C3E50" font-size="17" font-weight="700">Quick Reference: Radius → Kernel Size</text>

  <!-- Table headers -->
  <rect x="40" y="48" width="140" height="32" rx="6" fill="#2874A6"/>
  <text x="110" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Radius (X,Y,Z)</text>
  <rect x="188" y="48" width="140" height="32" rx="6" fill="#2874A6"/>
  <text x="258" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Kernel Size</text>
  <rect x="336" y="48" width="140" height="32" rx="6" fill="#2874A6"/>
  <text x="406" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Cells per Dim</text>
  <rect x="484" y="48" width="156" height="32" rx="6" fill="#2874A6"/>
  <text x="562" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Total Cells</text>

  <!-- Row 1 -->
  <rect x="40"  y="86" width="140" height="30" rx="4" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1"/>
  <text x="110" y="106" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">(1, 1, 1)</text>
  <rect x="188" y="86" width="140" height="30" rx="4" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
  <text x="258" y="106" text-anchor="middle" fill="#2C3E50" font-size="13">3 × 3 × 3</text>
  <rect x="336" y="86" width="140" height="30" rx="4" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
  <text x="406" y="106" text-anchor="middle" fill="#2C3E50" font-size="13">3</text>
  <rect x="484" y="86" width="156" height="30" rx="4" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
  <text x="562" y="106" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="700">27</text>

  <!-- Row 2 -->
  <rect x="40"  y="120" width="140" height="30" rx="4" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1"/>
  <text x="110" y="140" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">(2, 2, 2)</text>
  <rect x="188" y="120" width="140" height="30" rx="4" fill="#F0F2F5" stroke="#D0D5DA" stroke-width="1"/>
  <text x="258" y="140" text-anchor="middle" fill="#2C3E50" font-size="13">5 × 5 × 5</text>
  <rect x="336" y="120" width="140" height="30" rx="4" fill="#F0F2F5" stroke="#D0D5DA" stroke-width="1"/>
  <text x="406" y="140" text-anchor="middle" fill="#2C3E50" font-size="13">5</text>
  <rect x="484" y="120" width="156" height="30" rx="4" fill="#F0F2F5" stroke="#D0D5DA" stroke-width="1"/>
  <text x="562" y="140" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="700">125</text>

  <!-- Row 3 -->
  <rect x="40"  y="154" width="140" height="30" rx="4" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1"/>
  <text x="110" y="174" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">(3, 3, 3)</text>
  <rect x="188" y="154" width="140" height="30" rx="4" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
  <text x="258" y="174" text-anchor="middle" fill="#2C3E50" font-size="13">7 × 7 × 7</text>
  <rect x="336" y="154" width="140" height="30" rx="4" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
  <text x="406" y="174" text-anchor="middle" fill="#2C3E50" font-size="13">7</text>
  <rect x="484" y="154" width="156" height="30" rx="4" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
  <text x="562" y="174" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="700">343</text>
</svg>