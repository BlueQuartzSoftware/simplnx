<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="560" height="200" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>

  <!-- Title -->
  <text x="280" y="32" text-anchor="middle" fill="#2C3E50" font-size="17" font-weight="700">1D Example: Radius = 2  →  Kernel Size = 5</text>

  <!-- Cell strip -->
  <g transform="translate(280, 95)">
    <!-- Outside cell left -->
    <rect x="-224" y="-28" width="50" height="54" rx="7" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1.5"/>
    <text x="-199" y="4" text-anchor="middle" fill="#7a8a9c" font-size="11">...</text>

    <!-- Kernel neighbor far left -->
    <rect x="-168" y="-28" width="50" height="54" rx="7" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="-143" y="4" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">-2</text>

    <!-- Kernel neighbor left -->
    <rect x="-112" y="-28" width="50" height="54" rx="7" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="-87" y="4" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">-1</text>

    <!-- Center cell -->
    <rect x="-28" y="-28" width="56" height="54" rx="7" fill="#2874A6" stroke="#1a5276" stroke-width="2.5" filter="url(#sh)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Center</text>

    <!-- Kernel neighbor right -->
    <rect x="62" y="-28" width="50" height="54" rx="7" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="87" y="4" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">+1</text>

    <!-- Kernel neighbor far right -->
    <rect x="118" y="-28" width="50" height="54" rx="7" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="143" y="4" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">+2</text>

    <!-- Outside cell right -->
    <rect x="174" y="-28" width="50" height="54" rx="7" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1.5"/>
    <text x="199" y="4" text-anchor="middle" fill="#7a8a9c" font-size="11">...</text>

    <!-- Radius brackets (purple annotation) -->
    <line x1="-168" y1="40" x2="-28" y2="40" stroke="#8E44AD" stroke-width="2"/>
    <line x1="-168" y1="34" x2="-168" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <line x1="-28" y1="34" x2="-28" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <text x="-98" y="58" text-anchor="middle" fill="#8E44AD" font-size="11" font-weight="600">R = 2</text>

    <line x1="28" y1="40" x2="168" y2="40" stroke="#8E44AD" stroke-width="2"/>
    <line x1="28" y1="34" x2="28" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <line x1="168" y1="34" x2="168" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <text x="98" y="58" text-anchor="middle" fill="#8E44AD" font-size="11" font-weight="600">R = 2</text>

    <!-- Top bracket for kernel size (green = correct) -->
    <line x1="-168" y1="-42" x2="168" y2="-42" stroke="#27AE60" stroke-width="2"/>
    <line x1="-168" y1="-48" x2="-168" y2="-36" stroke="#27AE60" stroke-width="2"/>
    <line x1="168" y1="-48" x2="168" y2="-36" stroke="#27AE60" stroke-width="2"/>
    <text x="0" y="-52" text-anchor="middle" fill="#27AE60" font-size="12" font-weight="600">Kernel Size = 5 cells</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 175)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2874A6" stroke="#1a5276" stroke-width="1"/>
    <text x="20" y="12" fill="#2c3e50" font-size="11">Center cell</text>
    <rect x="115" y="0" width="14" height="14" rx="3" fill="#AED6F1" stroke="#2874A6" stroke-width="1"/>
    <text x="135" y="12" fill="#2c3e50" font-size="11">Kernel neighbor</text>
    <rect x="260" y="0" width="14" height="14" rx="3" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1"/>
    <text x="280" y="12" fill="#2c3e50" font-size="11">Outside kernel</text>
  </g>
</svg>