<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="560" height="200" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>

  <!-- Title -->
  <text x="280" y="32" text-anchor="middle" fill="#2C3E50" font-size="17" font-weight="700">1D Example: Radius = 1  →  Kernel Size = 3</text>

  <!-- Cell strip -->
  <g transform="translate(280, 95)">
    <!-- Outside cells -->
    <rect x="-224" y="-28" width="54" height="54" rx="7" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1.5"/>
    <text x="-197" y="4" text-anchor="middle" fill="#7a8a9c" font-size="11">...</text>
    <rect x="-164" y="-28" width="54" height="54" rx="7" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1.5"/>

    <!-- Kernel neighbor left -->
    <rect x="-100" y="-28" width="54" height="54" rx="7" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="-73" y="4" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">-1</text>

    <!-- Center cell -->
    <rect x="-30" y="-28" width="60" height="54" rx="7" fill="#2874A6" stroke="#1a5276" stroke-width="2.5" filter="url(#sh)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Center</text>

    <!-- Kernel neighbor right -->
    <rect x="46" y="-28" width="54" height="54" rx="7" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="73" y="4" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="600">+1</text>

    <!-- Outside cells -->
    <rect x="110" y="-28" width="54" height="54" rx="7" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1.5"/>
    <rect x="170" y="-28" width="54" height="54" rx="7" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1.5"/>
    <text x="197" y="4" text-anchor="middle" fill="#7a8a9c" font-size="11">...</text>

    <!-- Radius brackets (purple annotation) -->
    <line x1="-100" y1="40" x2="-30" y2="40" stroke="#8E44AD" stroke-width="2"/>
    <line x1="-100" y1="34" x2="-100" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <line x1="-30" y1="34" x2="-30" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <text x="-65" y="58" text-anchor="middle" fill="#8E44AD" font-size="11" font-weight="600">R = 1</text>

    <line x1="30" y1="40" x2="100" y2="40" stroke="#8E44AD" stroke-width="2"/>
    <line x1="30" y1="34" x2="30" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <line x1="100" y1="34" x2="100" y2="46" stroke="#8E44AD" stroke-width="2"/>
    <text x="65" y="58" text-anchor="middle" fill="#8E44AD" font-size="11" font-weight="600">R = 1</text>

    <!-- Top bracket for kernel size (green = correct) -->
    <line x1="-100" y1="-42" x2="100" y2="-42" stroke="#27AE60" stroke-width="2"/>
    <line x1="-100" y1="-48" x2="-100" y2="-36" stroke="#27AE60" stroke-width="2"/>
    <line x1="100" y1="-48" x2="100" y2="-36" stroke="#27AE60" stroke-width="2"/>
    <text x="0" y="-52" text-anchor="middle" fill="#27AE60" font-size="12" font-weight="600">Kernel Size = 3 cells</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 175)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2874A6" stroke="#1a5276" stroke-width="1"/>
    <text x="20" y="12" fill="#2c3e50" font-size="11">Center cell</text>
    <rect x="115" y="0" width="14" height="14" rx="3" fill="#AED6F1" stroke="#2874A6" stroke-width="1"/>
    <text x="135" y="12" fill="#2c3e50" font-size="11">Kernel neighbor</text>
    <rect x="260" y="0" width="14" height="14" rx="3" fill="#E8ECF0" stroke="#D0D5DA" stroke-width="1"/>
    <text x="280" y="12" fill="#2c3e50" font-size="11">Outside kernel</text>
  </g>
</svg>