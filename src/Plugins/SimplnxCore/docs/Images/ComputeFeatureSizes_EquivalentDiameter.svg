<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="sphere" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D6EAF8"/>
      <stop offset="55%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#2471A3"/>
    </radialGradient>
    <marker id="dArrL" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9 0 L0 4.5 L9 9 z" fill="#8E44AD"/></marker>
    <marker id="dArrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8E44AD"/></marker>
    <marker id="eqArr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5D6D7E"/></marker>
  </defs>

  <rect width="760" height="420" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>
  <text x="380" y="34" text-anchor="middle" fill="#2C3E50" font-size="18" font-weight="700">Equivalent Sphere Diameter</text>
  <text x="380" y="55" text-anchor="middle" fill="#5D6D7E" font-size="13">The diameter of the sphere with the same volume as the feature</text>

  <!-- Feature (irregular voxel cluster) -->
  <g stroke="#ffffff" stroke-width="1.5" fill="#2874A6">
    <rect x="130" y="95"  width="20" height="20"/><rect x="150" y="95"  width="20" height="20"/>
    <rect x="110" y="115" width="20" height="20"/><rect x="130" y="115" width="20" height="20"/><rect x="150" y="115" width="20" height="20"/><rect x="170" y="115" width="20" height="20"/>
    <rect x="110" y="135" width="20" height="20"/><rect x="130" y="135" width="20" height="20"/><rect x="150" y="135" width="20" height="20"/><rect x="170" y="135" width="20" height="20"/><rect x="190" y="135" width="20" height="20"/>
    <rect x="130" y="155" width="20" height="20"/><rect x="150" y="155" width="20" height="20"/><rect x="170" y="155" width="20" height="20"/>
  </g>
  <text x="160" y="196" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="600">Feature (grain)</text>
  <text x="160" y="212" text-anchor="middle" fill="#5D6D7E" font-size="11">V = (# cells) × (voxel volume)</text>

  <!-- equal-volume arrow -->
  <line x1="250" y1="135" x2="360" y2="135" stroke="#5D6D7E" stroke-width="2" marker-end="url(#eqArr)"/>
  <text x="305" y="126" text-anchor="middle" fill="#5D6D7E" font-size="12" font-weight="600">equal volume</text>

  <!-- Equivalent sphere -->
  <circle cx="470" cy="135" r="58" fill="url(#sphere)" stroke="#1a5276" stroke-width="1.5"/>
  <line x1="412" y1="135" x2="528" y2="135" stroke="#8E44AD" stroke-width="2" marker-start="url(#dArrL)" marker-end="url(#dArrR)"/>
  <text x="470" y="124" text-anchor="middle" fill="#4A235A" font-size="14" font-weight="700">d</text>
  <text x="470" y="212" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="600">Equivalent sphere</text>

  <!-- Formula box -->
  <g transform="translate(150, 240)">
    <rect x="0" y="0" width="460" height="52" rx="7" fill="#EBF5FB" stroke="#2874A6" stroke-width="1.2"/>
    <text x="230" y="32" text-anchor="middle" fill="#1a5276" font-size="17" font-weight="700">d = 2 · ( 3V / 4π )<tspan font-size="11" baseline-shift="super">1/3</tspan></text>
  </g>

  <!-- 2D + outputs tip -->
  <g transform="translate(50, 316)">
    <rect x="0" y="0" width="660" height="72" rx="7" fill="#FEF5E7" stroke="#E67E22" stroke-width="1.2"/>
    <path d="M20 9 l2.6 5.3 5.8 0.8 -4.2 4.1 1 5.8 -5.2 -2.7 -5.2 2.7 1 -5.8 -4.2 -4.1 5.8 -0.8 z" fill="#E67E22"/>
    <text x="40" y="22" fill="#7E5109" font-size="12">If the image is <tspan font-weight="600">2D</tspan> (one dimension = 1), an <tspan font-weight="600">Equivalent Circular Diameter</tspan> is computed instead,</text>
    <text x="40" y="40" fill="#7E5109" font-size="12">from the feature <tspan font-weight="600">area</tspan>:  d = 2 · √( A / π ).</text>
    <text x="40" y="60" fill="#7E5109" font-size="12">Outputs: <tspan font-weight="600">EquivalentDiameters</tspan>, <tspan font-weight="600">Volumes</tspan>, <tspan font-weight="600">NumElements</tspan> (per feature).</text>
  </g>
</svg>
