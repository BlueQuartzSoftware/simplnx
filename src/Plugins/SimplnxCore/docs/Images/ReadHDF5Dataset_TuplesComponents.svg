<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="rs" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8E44AD"/></marker>
    <marker id="an" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5D6D7E"/></marker>
  </defs>
  <rect width="760" height="420" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>
  <text x="380" y="34" text-anchor="middle" fill="#2C3E50" font-size="18" font-weight="700">Read HDF5 Dataset</text>
  <text x="380" y="55" text-anchor="middle" fill="#5D6D7E" font-size="13">A flat dataset is reshaped into tuples × components</text>

  <!-- Flat dataset -->
  <text x="320" y="84" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="600">HDF5 dataset (flat) — 12 values</text>
  <g font-size="10" fill="#1a5276" text-anchor="middle">
    <g stroke="#2874A6" fill="#AED6F1" stroke-width="1.25">
      <rect x="188" y="92" width="22" height="22"/><rect x="210" y="92" width="22" height="22"/><rect x="232" y="92" width="22" height="22"/><rect x="254" y="92" width="22" height="22"/><rect x="276" y="92" width="22" height="22"/><rect x="298" y="92" width="22" height="22"/><rect x="320" y="92" width="22" height="22"/><rect x="342" y="92" width="22" height="22"/><rect x="364" y="92" width="22" height="22"/><rect x="386" y="92" width="22" height="22"/><rect x="408" y="92" width="22" height="22"/><rect x="430" y="92" width="22" height="22"/>
    </g>
    <text x="199" y="107">0</text><text x="221" y="107">1</text><text x="243" y="107">2</text><text x="265" y="107">3</text><text x="287" y="107">4</text><text x="309" y="107">5</text><text x="331" y="107">6</text><text x="353" y="107">7</text><text x="375" y="107">8</text><text x="397" y="107">9</text><text x="419" y="107">10</text><text x="441" y="107">11</text>
  </g>

  <!-- reshape arrow -->
  <line x1="320" y1="122" x2="320" y2="162" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#rs)"/>
  <text x="336" y="146" fill="#8E44AD" font-size="12" font-weight="700">reshape</text>

  <!-- Reshaped table: 6 tuples (rows) x 2 components (cols) -->
  <text x="255" y="182" text-anchor="middle" fill="#5D6D7E" font-size="10.5" transform="rotate(-90,255,270)">tuples (6)</text>
  <text x="316" y="180" text-anchor="middle" fill="#5D6D7E" font-size="10.5">components (2)</text>
  <g font-size="10" fill="#1a5276" text-anchor="middle">
    <g stroke="#2874A6" fill="#AED6F1" stroke-width="1.25">
      <rect x="288" y="186" width="28" height="28"/><rect x="316" y="186" width="28" height="28"/>
      <rect x="288" y="214" width="28" height="28"/><rect x="316" y="214" width="28" height="28"/>
      <rect x="288" y="242" width="28" height="28"/><rect x="316" y="242" width="28" height="28"/>
      <rect x="288" y="270" width="28" height="28"/><rect x="316" y="270" width="28" height="28"/>
      <rect x="288" y="298" width="28" height="28"/><rect x="316" y="298" width="28" height="28"/>
      <rect x="288" y="326" width="28" height="28"/><rect x="316" y="326" width="28" height="28"/>
    </g>
    <text x="302" y="204">0</text><text x="330" y="204">1</text>
    <text x="302" y="232">2</text><text x="330" y="232">3</text>
    <text x="302" y="260">4</text><text x="330" y="260">5</text>
    <text x="302" y="288">6</text><text x="330" y="288">7</text>
    <text x="302" y="316">8</text><text x="330" y="316">9</text>
    <text x="302" y="344">10</text><text x="330" y="344">11</text>
  </g>
  <text x="316" y="372" text-anchor="middle" fill="#2C3E50" font-size="12" font-weight="600">DataArray — 6 tuples × 2 components</text>

  <!-- Formula / note box -->
  <g transform="translate(430, 150)">
    <rect x="0" y="0" width="296" height="200" rx="8" fill="#EBF5FB" stroke="#2874A6" stroke-width="1.2"/>
    <text x="16" y="26" fill="#2874A6" font-size="13" font-weight="700">Reshape rule</text>
    <text x="16" y="52" fill="#1a5276" font-size="12">total values = ∏(tuple dims) × ∏(comp dims)</text>
    <text x="148" y="82" text-anchor="middle" fill="#1a5276" font-size="18" font-weight="700">12 = 6 × 2</text>
    <line x1="16" y1="98" x2="280" y2="98" stroke="#CBD9E4"/>
    <text x="16" y="122" fill="#4A235A" font-size="11.5" font-weight="600">Tuple dimensions</text>
    <text x="16" y="139" fill="#5D6D7E" font-size="11">how many elements (e.g. voxels / rows).</text>
    <text x="16" y="166" fill="#4A235A" font-size="11.5" font-weight="600">Component dimensions</text>
    <text x="16" y="183" fill="#5D6D7E" font-size="11">values per element (e.g. a 3-vector → 3).</text>
  </g>
</svg>
