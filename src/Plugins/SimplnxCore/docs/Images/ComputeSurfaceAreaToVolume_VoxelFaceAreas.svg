<text x="280" y="469" class="formula" text-anchor="start">dy × dz</text>
<text x="570" y="469" class="body" text-anchor="start">0.50 × 0.25</text>
<text x="846" y="469" class="body" text-anchor="start">0.125</text>
<rect x="40" y="487" width="1000" height="34" fill="#EBF5FB"/>
<rect x="52" y="496" width="12" height="12" fill="#AED6F1" stroke="#5D6D7E"/>
