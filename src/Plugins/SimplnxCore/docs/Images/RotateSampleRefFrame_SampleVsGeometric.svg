<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrPurple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8E44AD"/>
    </marker>
    <marker id="arrSlate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2C3E50"/>
    </marker>
  </defs>

  <rect width="780" height="430" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>
  <text x="390" y="34" text-anchor="middle" fill="#2C3E50" font-size="18" font-weight="700">Sample reference-frame rotation vs geometric rotation</text>
  <text x="390" y="56" text-anchor="middle" fill="#5D6D7E" font-size="13">The same 90° rotation, applied two different ways</text>

  <!-- ===== Panel A: Rotate Sample Reference Frame ===== -->
  <g transform="translate(38, 76)">
    <rect x="0" y="0" width="352" height="250" rx="8" fill="#F7F9FB" stroke="#E1E6EA" stroke-width="1"/>
    <text x="176" y="24" text-anchor="middle" fill="#2874A6" font-size="14" font-weight="700">Rotate Sample Reference Frame</text>
    <text x="176" y="42" text-anchor="middle" fill="#5D6D7E" font-size="12">axes rotate · microstructure fixed</text>

    <!-- grid -->
    <g transform="translate(96, 58)">
      <rect x="0" y="0" width="136" height="136" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
      <line x1="34" y1="0" x2="34" y2="136" stroke="#E8ECF0"/>
      <line x1="68" y1="0" x2="68" y2="136" stroke="#E8ECF0"/>
      <line x1="102" y1="0" x2="102" y2="136" stroke="#E8ECF0"/>
      <line x1="0" y1="34" x2="136" y2="34" stroke="#E8ECF0"/>
      <line x1="0" y1="68" x2="136" y2="68" stroke="#E8ECF0"/>
      <line x1="0" y1="102" x2="136" y2="102" stroke="#E8ECF0"/>
      <!-- L-shape (fixed position) -->
      <rect x="1" y="69" width="33" height="33" fill="#2874A6" stroke="#1a5276"/>
      <rect x="1" y="103" width="33" height="33" fill="#2874A6" stroke="#1a5276"/>
      <rect x="35" y="103" width="33" height="33" fill="#2874A6" stroke="#1a5276"/>
    </g>

    <!-- original axes (faint) at origin (96, 194) -->
    <line x1="96" y1="194" x2="140" y2="194" stroke="#B7C0C8" stroke-width="1.5" marker-end="url(#arrSlate)" opacity="0.5"/>
    <line x1="96" y1="194" x2="96" y2="150" stroke="#B7C0C8" stroke-width="1.5" marker-end="url(#arrSlate)" opacity="0.5"/>
    <text x="146" y="198" fill="#B7C0C8" font-size="10">x</text>
    <text x="86" y="150" fill="#B7C0C8" font-size="10">y</text>

    <!-- rotated axes (bold purple): x' up, y' left  (90° about +Z) -->
    <line x1="96" y1="194" x2="96" y2="150" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrPurple)"/>
    <line x1="96" y1="194" x2="52" y2="194" stroke="#8E44AD" stroke-width="2.5" marker-end="url(#arrPurple)"/>
    <text x="101" y="150" fill="#8E44AD" font-size="12" font-weight="700">x'</text>
    <text x="44" y="210" fill="#8E44AD" font-size="12" font-weight="700">y'</text>
    <circle cx="96" cy="194" r="3" fill="#8E44AD"/>
  </g>

  <!-- ===== Panel B: Geometric rotation ===== -->
  <g transform="translate(390, 76)">
    <rect x="0" y="0" width="352" height="250" rx="8" fill="#F7F9FB" stroke="#E1E6EA" stroke-width="1"/>
    <text x="176" y="24" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="700">Geometric rotation</text>
    <text x="176" y="42" text-anchor="middle" fill="#5D6D7E" font-size="12">data rotates · axes fixed</text>

    <g transform="translate(96, 58)">
      <rect x="0" y="0" width="136" height="136" fill="#ffffff" stroke="#D0D5DA" stroke-width="1"/>
      <line x1="34" y1="0" x2="34" y2="136" stroke="#E8ECF0"/>
      <line x1="68" y1="0" x2="68" y2="136" stroke="#E8ECF0"/>
      <line x1="102" y1="0" x2="102" y2="136" stroke="#E8ECF0"/>
      <line x1="0" y1="34" x2="136" y2="34" stroke="#E8ECF0"/>
      <line x1="0" y1="68" x2="136" y2="68" stroke="#E8ECF0"/>
      <line x1="0" y1="102" x2="136" y2="102" stroke="#E8ECF0"/>
      <!-- L-shape rotated 90° CW relative to Panel A -->
      <rect x="1" y="1" width="33" height="33" fill="#2874A6" stroke="#1a5276"/>
      <rect x="35" y="1" width="33" height="33" fill="#2874A6" stroke="#1a5276"/>
      <rect x="35" y="35" width="33" height="33" fill="#2874A6" stroke="#1a5276"/>
    </g>

    <!-- fixed axes (bold slate): x right, y up -->
    <line x1="96" y1="194" x2="140" y2="194" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrSlate)"/>
    <line x1="96" y1="194" x2="96" y2="150" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#arrSlate)"/>
    <text x="146" y="198" fill="#2C3E50" font-size="12" font-weight="700">x</text>
    <text x="86" y="150" fill="#2C3E50" font-size="12" font-weight="700">y</text>
    <circle cx="96" cy="194" r="3" fill="#2C3E50"/>
  </g>

  <!-- Note callout -->
  <g transform="translate(38, 338)">
    <rect x="0" y="0" width="704" height="52" rx="7" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1.2"/>
    <circle cx="20" cy="26" r="9" fill="#8E44AD"/>
    <text x="20" y="30" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">i</text>
    <text x="38" y="21" fill="#4A235A" font-size="12"><tspan font-weight="600">Rotate Sample Reference Frame</tspan> rotates the coordinate axes and resamples the cell data onto the new grid — the physical</text>
    <text x="38" y="37" fill="#4A235A" font-size="12">microstructure is unchanged, and the origin usually shifts. To rotate the data itself, use <tspan font-weight="600">Apply Transformation to Geometry</tspan>.</text>
  </g>
</svg>
