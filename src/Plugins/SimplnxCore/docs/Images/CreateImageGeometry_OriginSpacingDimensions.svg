<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="tick" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2" fill="#8E44AD"/></marker>
    <marker id="axArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#27AE60"/></marker>
  </defs>

  <rect width="760" height="470" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>
  <text x="380" y="34" text-anchor="middle" fill="#2C3E50" font-size="18" font-weight="700">Image Geometry: origin, spacing, dimensions</text>
  <text x="380" y="56" text-anchor="middle" fill="#5D6D7E" font-size="13">A regular grid fully defined by three 3-vectors</text>

  <!-- grid 5x4, cell 40, top-left (250,90) -> spans x250..450, y90..250; origin bottom-left (250,250) -->
  <g stroke="#2874A6" fill="#AED6F1" stroke-width="1.25">
    <rect x="250" y="90"  width="40" height="40"/><rect x="290" y="90"  width="40" height="40"/><rect x="330" y="90"  width="40" height="40"/><rect x="370" y="90"  width="40" height="40"/><rect x="410" y="90"  width="40" height="40"/>
    <rect x="250" y="130" width="40" height="40"/><rect x="290" y="130" width="40" height="40"/><rect x="330" y="130" width="40" height="40"/><rect x="370" y="130" width="40" height="40"/><rect x="410" y="130" width="40" height="40"/>
    <rect x="250" y="170" width="40" height="40"/><rect x="290" y="170" width="40" height="40"/><rect x="330" y="170" width="40" height="40"/><rect x="370" y="170" width="40" height="40"/><rect x="410" y="170" width="40" height="40"/>
    <rect x="250" y="210" width="40" height="40"/><rect x="290" y="210" width="40" height="40"/><rect x="330" y="210" width="40" height="40"/><rect x="370" y="210" width="40" height="40"/><rect x="410" y="210" width="40" height="40"/>
  </g>

  <!-- Dimensions X bracket (top) -->
  <line x1="250" y1="78" x2="450" y2="78" stroke="#8E44AD" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="350" y="72" text-anchor="middle" fill="#8E44AD" font-size="12" font-weight="600">dimensions X = 5 cells</text>

  <!-- Dimensions Y bracket (right) -->
  <line x1="466" y1="90" x2="466" y2="250" stroke="#8E44AD" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="470" y="174" fill="#8E44AD" font-size="12" font-weight="600" transform="rotate(90,470,174)" text-anchor="middle">dimensions Y = 4 cells</text>

  <!-- Spacing X bracket (bottom, one cell) -->
  <line x1="250" y1="264" x2="290" y2="264" stroke="#E67E22" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="270" y="282" text-anchor="middle" fill="#B9600F" font-size="11.5" font-weight="600">spacing X</text>

  <!-- Spacing Y bracket (left, one cell) -->
  <line x1="236" y1="90" x2="236" y2="130" stroke="#E67E22" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="230" y="110" fill="#B9600F" font-size="11.5" font-weight="600" transform="rotate(-90,230,110)" text-anchor="middle">spacing Y</text>

  <!-- Origin at bottom-left grid point (250,250) -->
  <line x1="250" y1="250" x2="298" y2="250" stroke="#27AE60" stroke-width="2" marker-end="url(#axArr)"/>
  <line x1="250" y1="250" x2="250" y2="202" stroke="#27AE60" stroke-width="2" marker-end="url(#axArr)"/>
  <text x="300" y="266" fill="#1E8449" font-size="11" font-weight="700">x</text>
  <text x="238" y="200" fill="#1E8449" font-size="11" font-weight="700">y</text>
  <circle cx="250" cy="250" r="4.5" fill="#27AE60" stroke="#ffffff" stroke-width="1"/>
  <text x="250" y="300" text-anchor="middle" fill="#1E8449" font-size="12" font-weight="600">origin</text>
  <text x="250" y="315" text-anchor="middle" fill="#5D6D7E" font-size="11">(bottom-left grid point)</text>

  <!-- Note callout -->
  <g transform="translate(30, 352)">
    <rect x="0" y="0" width="700" height="94" rx="7" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1.2"/>
    <circle cx="20" cy="24" r="9" fill="#8E44AD"/>
    <text x="20" y="28" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">i</text>
    <text x="38" y="21" fill="#4A235A" font-size="12"><tspan font-weight="600">Dimensions</tspan> — number of cells per axis (uint64, 0-based: a value of 5 spans indices 0–4).</text>
    <text x="38" y="41" fill="#4A235A" font-size="12"><tspan font-weight="600">Spacing</tspan> — physical distance between grid planes per axis (float32, e.g. microns); must be positive.</text>
    <text x="38" y="61" fill="#4A235A" font-size="12"><tspan font-weight="600">Origin</tspan> — physical location of the bottom-left grid point (float32).</text>
    <text x="38" y="81" fill="#4A235A" font-size="12">Image geometries are always 3D; a 2D image sets one dimension to 1.</text>
  </g>
</svg>
