<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card -->
  <rect width="760" height="470" rx="12" fill="#ffffff" stroke="#D0D5DA" stroke-width="1.5"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" fill="#2C3E50" font-size="18" font-weight="700">Coordination Number = differing face-neighbors</text>
  <text x="380" y="57" text-anchor="middle" fill="#5D6D7E" font-size="13">Count of a cell's 6 face-neighbors (±X, ±Y, ±Z) that belong to a <tspan font-weight="600">different feature</tspan></text>

  <!-- ============ Panel A: CN = 3 ============ -->
  <g transform="translate(40, 78)">
    <rect x="0" y="0" width="330" height="250" rx="8" fill="#F7F9FB" stroke="#E1E6EA" stroke-width="1"/>
    <text x="165" y="26" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="600">CN = 3  ·  edge cell</text>

    <!-- depth connectors -->
    <line x1="185" y1="115" x2="232" y2="70" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="145" y1="135" x2="98" y2="182" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- +Z (differs) with depth shadow -->
    <rect x="216" y="54" width="40" height="40" rx="5" fill="#d7bfe0" stroke="#8E44AD" stroke-width="1"/>
    <rect x="212" y="50" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
    <text x="232" y="75" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">+Z</text>

    <!-- +Y up (differs) -->
    <rect x="125" y="55" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" filter="url(#sh)"/>
    <text x="145" y="80" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">+Y</text>

    <!-- -X left (same) -->
    <rect x="77" y="103" width="40" height="40" rx="5" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="97" y="128" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="700">−X</text>

    <!-- center -->
    <rect x="125" y="103" width="40" height="40" rx="5" fill="#2874A6" stroke="#1a5276" stroke-width="2.5" filter="url(#sh)"/>
    <text x="145" y="127" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">cell</text>

    <!-- +X right (differs) -->
    <rect x="173" y="103" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" filter="url(#sh)"/>
    <text x="193" y="128" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">+X</text>

    <!-- -Y down (same) -->
    <rect x="125" y="151" width="40" height="40" rx="5" fill="#AED6F1" stroke="#2874A6" stroke-width="2" filter="url(#sh)"/>
    <text x="145" y="176" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="700">−Y</text>

    <!-- -Z (same) with depth shadow -->
    <rect x="82" y="170" width="40" height="40" rx="5" fill="#9cc4de" stroke="#2874A6" stroke-width="1"/>
    <rect x="78" y="166" width="40" height="40" rx="5" fill="#AED6F1" stroke="#2874A6" stroke-width="2"/>
    <text x="98" y="191" text-anchor="middle" fill="#1a5276" font-size="11" font-weight="700">−Z</text>

    <text x="165" y="238" text-anchor="middle" fill="#5D6D7E" font-size="12"><tspan font-weight="700" fill="#E74C3C">3</tspan> of 6 neighbors differ</text>
  </g>

  <!-- ============ Panel B: CN = 6 ============ -->
  <g transform="translate(390, 78)">
    <rect x="0" y="0" width="330" height="250" rx="8" fill="#F7F9FB" stroke="#E1E6EA" stroke-width="1"/>
    <text x="165" y="26" text-anchor="middle" fill="#2C3E50" font-size="14" font-weight="600">CN = 6  ·  isolated cell</text>

    <line x1="185" y1="115" x2="232" y2="70" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="145" y1="135" x2="98" y2="182" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- +Z -->
    <rect x="216" y="54" width="40" height="40" rx="5" fill="#e6c9c4" stroke="#E74C3C" stroke-width="1"/>
    <rect x="212" y="50" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
    <text x="232" y="75" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">+Z</text>

    <rect x="125" y="55" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" filter="url(#sh)"/>
    <text x="145" y="80" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">+Y</text>

    <rect x="77" y="103" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" filter="url(#sh)"/>
    <text x="97" y="128" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">−X</text>

    <rect x="125" y="103" width="40" height="40" rx="5" fill="#2874A6" stroke="#1a5276" stroke-width="2.5" filter="url(#sh)"/>
    <text x="145" y="127" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">cell</text>

    <rect x="173" y="103" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" filter="url(#sh)"/>
    <text x="193" y="128" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">+X</text>

    <rect x="125" y="151" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2" filter="url(#sh)"/>
    <text x="145" y="176" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">−Y</text>

    <rect x="82" y="170" width="40" height="40" rx="5" fill="#e6c9c4" stroke="#E74C3C" stroke-width="1"/>
    <rect x="78" y="166" width="40" height="40" rx="5" fill="#FADBD8" stroke="#E74C3C" stroke-width="2"/>
    <text x="98" y="191" text-anchor="middle" fill="#922B21" font-size="11" font-weight="700">−Z</text>

    <text x="165" y="238" text-anchor="middle" fill="#5D6D7E" font-size="12"><tspan font-weight="700" fill="#E74C3C">6</tspan> of 6 neighbors differ</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2874A6" stroke="#1a5276" stroke-width="1"/>
    <text x="20" y="12" fill="#2c3e50" font-size="11.5">center cell</text>
    <rect x="120" y="0" width="14" height="14" rx="3" fill="#AED6F1" stroke="#2874A6" stroke-width="1"/>
    <text x="140" y="12" fill="#2c3e50" font-size="11.5">same feature</text>
    <rect x="250" y="0" width="14" height="14" rx="3" fill="#FADBD8" stroke="#E74C3C" stroke-width="1.5"/>
    <text x="270" y="12" fill="#2c3e50" font-size="11.5">different feature (counts toward CN)</text>
  </g>

  <!-- Note callout -->
  <g transform="translate(40, 372)">
    <rect x="0" y="0" width="680" height="40" rx="7" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1.2"/>
    <circle cx="20" cy="20" r="9" fill="#8E44AD"/>
    <text x="20" y="24" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">i</text>
    <text x="38" y="17" fill="#4A235A" font-size="12"><tspan font-weight="600">When CN ≥ the Coordination Number parameter,</tspan> the cell's Feature Id and attributes are replaced by a neighbor's</text>
    <text x="38" y="33" fill="#4A235A" font-size="12">values. With <tspan font-style="italic">Loop Until Gone</tspan> enabled, the sweep repeats until no remaining cell meets the criterion.</text>
  </g>

  <!-- Tip callout -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="680" height="34" rx="7" fill="#FEF5E7" stroke="#E67E22" stroke-width="1.2"/>
    <path d="M20 7 l2.6 5.3 5.8 0.8 -4.2 4.1 1 5.8 -5.2 -2.7 -5.2 2.7 1 -5.8 -4.2 -4.1 5.8 -0.8 z" fill="#E67E22"/>
    <text x="40" y="22" fill="#7E5109" font-size="12"><tspan font-weight="600">Higher coordination number = more isolated</tspan> — a higher threshold absorbs only the most isolated cells.</text>
  </g>
</svg>
