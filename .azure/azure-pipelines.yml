
trigger:
  - develop

jobs:
- job:
  strategy:
    matrix:
      Windows:
        imageName: Windows_NT
        preset_name: azure-windows-v143
        architecture: X64
      Linux:
        imageName: Linux
        preset_name: azure-linux-x64
        architecture: X64

  pool:
    name: BlueQuartz Self Hosted
    demands:
      - Agent.OS -equals $(imageName)
      - BQ.SIMPLNX
      - Agent.OSArchitecture -equals $(architecture)

  workspace:
    clean: all

  timeoutInMinutes: 120

  variables:
    simplnx_source_dir: $(Build.Repository.LocalPath)
    build_type: Release

  steps:
  - checkout: self
    submodules: true

  - powershell: |
      try {
        echo System.PullRequest.SourceBranch=$(System.PullRequest.SourceBranch)
        echo System.PullRequest.PullRequestNumber=$(System.PullRequest.PullRequestNumber)
      } catch {
      }
      echo Build.SourceBranchName=$(Build.SourceBranchName)
      echo Build.Repository.Name=$(Build.Repository.Name)
      echo Build.Repository.Uri=$(Build.Repository.Uri)
      echo Build.Repository.LocalPath=$(Build.Repository.LocalPath)
      echo Build.BuildNumber=$(Build.BuildNumber)
      echo Agent.WorkFolder=$(Agent.WorkFolder)
      echo Agent.OS=$(Agent.OS)
      echo Agent.OSArchitecture=$(Agent.OSArchitecture)
      echo preset_name=$(preset_name)
    displayName: 'Dump Azure Variables'

#==================================================================================================
# CTest Section:
# Keep the three `ctest -S` invocations separate so configure, build, and test output
# land in separate Azure steps.
#==================================================================================================

  - powershell: |
      cd "$(Build.BinariesDirectory)"
      ctest -VV "-DCTEST_SOURCE_DIR=$(simplnx_source_dir)" "-DCTEST_BINARY_DIRECTORY=$(Build.BinariesDirectory)" "-DCTEST_DASHBOARD_ROOT=$(Build.Repository.LocalPath)" "-DCMAKE_PRESET_NAME=$(preset_name)" "-DCTEST_CONFIGURATION_TYPE=$(build_type)" -S "$(Build.Repository.LocalPath)/.azure/azure_ci_configure.cmake"
      exit $LASTEXITCODE
    displayName: CTest Configure

  - powershell: |
      cd "$(Build.BinariesDirectory)"
      ctest -VV "-DCTEST_SOURCE_DIR=$(simplnx_source_dir)" "-DCTEST_BINARY_DIRECTORY=$(Build.BinariesDirectory)" "-DCTEST_DASHBOARD_ROOT=$(Build.Repository.LocalPath)" "-DCMAKE_PRESET_NAME=$(preset_name)" "-DCTEST_CONFIGURATION_TYPE=$(build_type)" -S "$(Build.Repository.LocalPath)/.azure/azure_ci_build.cmake"
      exit $LASTEXITCODE
    displayName: CTest Build

  - powershell: |
      cd "$(Build.BinariesDirectory)"
      ctest -V --output-on-failure --no-compress-output "-DCTEST_SOURCE_DIR=$(simplnx_source_dir)" "-DCTEST_BINARY_DIRECTORY=$(Build.BinariesDirectory)" "-DCTEST_DASHBOARD_ROOT=$(Build.Repository.LocalPath)" "-DCMAKE_PRESET_NAME=$(preset_name)" "-DCTEST_CONFIGURATION_TYPE=$(build_type)" -S "$(Build.Repository.LocalPath)/.azure/azure_ci_test.cmake"
      exit $LASTEXITCODE
    displayName: CTest Test

#==================================================================================================
# Publish Test Results
#==================================================================================================
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: CTest
      testResultsFiles: $(Build.BinariesDirectory)/Testing/*/Test.xml
      testRunTitle: CTest_$(Agent.Name)_$(Agent.OS)
      failTaskOnFailedTests: true
    displayName: 'Publish Test Results'

#==================================================================================================
# CPack Section
#==================================================================================================
  - powershell: |
      cd "$(Build.BinariesDirectory)"
      cpack -C $(build_type) --verbose
      exit $LASTEXITCODE
    condition: succeeded()
    continueOnError: true
    displayName: 'Packing SIMPLNX'
