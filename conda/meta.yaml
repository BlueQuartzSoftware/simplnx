{% set name = "simplnx" %}
{% set version = "25.09.28" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - path: ../
    folder: simplnx
  - git_url: https://github.com/BlueQuartzSoftware/EbsdLib
    git_rev: v2.4.0
    folder: EbsdLib
  - git_url: https://github.com/BlueQuartzSoftware/H5Support
    git_rev: v1.0.13
    folder: H5Support
  - git_url: https://github.com/martinmoene/expected-lite
    git_rev: v0.8.0
    folder: expected-lite
  - git_url: https://github.com/fr00b0/nod
    git_rev: v0.5.4
    folder: nod
  - git_url: https://github.com/martinmoene/span-lite
    git_rev: v0.11.0
    folder: span-lite
  - git_url: https://github.com/nothings/stb
    folder: stb    
  - url: https://raw.githubusercontent.com/BlueQuartzSoftware/simplnx-registry/9a5db7b5fa02b2495eb51654cbaab3c63820c779/ports/nod/CMakeLists.txt
    folder: nod

build:
  number: 0
  script_env:
    - SIMPLNX_CMAKE_PRESET=conda-win # [win]
    - SIMPLNX_CMAKE_PRESET=conda-linux # [linux]
    - SIMPLNX_CMAKE_PRESET=conda-osx # [osx]
    - CONDA_OVERRIDE_OSX=11.0 # [osx]
    - ITK_VERSION=5.4.4

requirements:
  build:
    - {{ compiler('cxx') }}
    - cmake =3.30
    - ninja
    - git
  host:
    - python {{ python }}
    - numpy >=1.16
    - mypy
    - boost_mp11
    - eigen
    - fmt =11
    - hdf5 >=1.14.3
    - nlohmann_json
    - pybind11 =2.12
    - reproc-cpp
    - tbb
    - tbb-devel
    - zlib
    - sphinx
    - myst-parser
    - sphinx-markdown-tables
    - sphinx_rtd_theme
    - libitk-devel =5.4
    - spdlog =1.15

  run:
    - python
    - numpy
    - fmt =11
    - hdf5 >=1.14.3
    - reproc-cpp
    - tbb
    - zlib
    - spdlog =1.15
    - libitk =5.4

test:
  imports:
    - simplnx

about:
  home: https://www.dream3d.io/
  license: Affero GPL
  summary: simplnx consists of data analysis tools (Filters) that allow for the construction of customized workflows (Pipelines) to analyze data.
