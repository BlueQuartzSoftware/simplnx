name: linux

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

jobs:
  build:
    env:
      VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        cxx:
          - g++-13
          - clang++-16
        include:
          - cxx: g++-13
            cc: gcc-13
          - cxx: clang++-16
            cc: clang-16
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx myst-parser sphinx-markdown-tables sphinx_rtd_theme numpy
      - name: Add C++ Problem Matcher
        uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9
      - name: Install mono
        run: |
          sudo apt-get update
          sudo apt-get install mono-complete
      - name: Setup NuGet Credentials
        shell: bash
        run: |
          mono `vcpkg fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/BlueQuartzSoftware/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "BlueQuartzSoftware" \
          -password "${{secrets.GITHUB_TOKEN}}"
          mono `vcpkg fetch nuget | tail -n 1` \
          setapikey "${{secrets.GITHUB_TOKEN}}" \
          -source "https://nuget.pkg.github.com/BlueQuartzSoftware/index.json"
      - name: Configure
        env:
          CC: ${{matrix.cc}}
          CXX: ${{matrix.cxx}}
        run: |
          cmake --preset ci-linux-x64 ${{github.workspace}}
      - name: Build
        run: |
          cmake --build --preset ci-linux-x64
      # Temporary: remove both capture steps after the native library review.
      - name: Capture bounded-read toolchain
        continue-on-error: true
        run: python scripts/capture_bounded_toolchain.py --build-dir build --output-dir bounded-toolchain-capture
      - name: Upload bounded-read toolchain
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-toolchain-${{matrix.os}}-${{matrix.cxx}}
          path: bounded-toolchain-capture/
          retention-days: 7
      - name: Test
        run: |
          ctest --preset ci-linux-x64
